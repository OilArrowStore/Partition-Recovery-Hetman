name: "Dill"
run-name: "Zenith"
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
  pages: write
concurrency:
  group: "VOYAGE-${{ github.workflow }}"
  cancel-in-progress: false
jobs:
  OBSIDIAN:
    runs-on: ubuntu-latest
    environment:
      name: "github-pages"
      url: ${{ steps.Barley.outputs.page_url }}
    steps:
      - name: "Falcon"
        uses: actions/checkout@v7
      - name: "Prairie"
        uses: actions/configure-pages@v6
      - name: "Daybreak"
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./
      - name: "EAGLE"
        id: Barley
        uses: actions/deploy-pages@v5
